name: 🦆 Build DuckDB without AVX

# The official DuckDB wheels for Linux x86-64 are compiled for x86-64-v3 (AVX2), so they stop with an illegal
# instruction on CPUs without AVX, such as the Intel Celeron of many NAS. This workflow compiles the DuckDB version of
# requirements.txt once for x86-64-v2 with DuckDB's own EXTENSION profile, and keeps the wheel in a GitHub release that
# the latest-noavx image installs. A version that already has its release is not compiled again.

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      wheel_url:
        description: "Download address of the wheel for CPUs without AVX"
        value: ${{ jobs.wheel.outputs.wheel_url }}

jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: python:3.15-slim
    concurrency:
      group: duckdb-noavx-wheel-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    outputs:
      wheel_url: ${{ steps.result.outputs.wheel_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gh ca-certificates

      - name: Resolve the DuckDB version and its release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          spec=$(grep -E '^duckdb' requirements.txt)
          pip install --dry-run --quiet --no-deps --ignore-installed --report /tmp/report.json "${spec}"
          version=$(python -c "import json; print(json.load(open('/tmp/report.json'))['install'][0]['metadata']['version'])")
          tag="duckdb-noavx-${version}"
          url=$(gh release view "${tag}" --json assets -q '.assets[] | select(.name | endswith(".whl")) | .url' 2>/dev/null || true)
          echo "DuckDB ${version}: ${url:-no wheel yet}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Install the toolchain
        if: steps.release.outputs.url == ''
        run: apt-get install -y --no-install-recommends build-essential clang lld cmake ninja-build git qemu-user

      - name: Build the wheel for x86-64-v2
        if: steps.release.outputs.url == ''
        env:
          CC: clang
          CXX: clang++
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          pip wheel --no-deps --no-binary duckdb \
            --config-settings=cmake.define.DUCKDB_PY_LTO=thin \
            --config-settings=cmake.define.DUCKDB_OPTIMIZATION_PROFILE=EXTENSION \
            -w dist "duckdb==${VERSION}"
          ls -l dist

      - name: Check the wheel on a CPU without AVX
        if: steps.release.outputs.url == ''
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/built
          /tmp/built/bin/pip install --quiet numpy pandas
          /tmp/built/bin/pip install --quiet --no-deps dist/*.whl
          cat > /tmp/check.py <<'PY'
          import duckdb, tempfile
          folder = tempfile.mkdtemp()
          connection = duckdb.connect(config={'memory_limit': '1GB', 'threads': 2})
          connection.execute(f"COPY (SELECT i, i * 2 AS v, 'x' || i AS s FROM range(200000) t(i)) TO '{folder}/a.parquet' (FORMAT parquet, COMPRESSION zstd)")
          print(duckdb.__version__, connection.execute(f"SELECT COUNT(*), SUM(v), COUNT(DISTINCT s) FROM read_parquet('{folder}/a.parquet')").fetchall())
          PY
          qemu-x86_64 -cpu Denverton /tmp/built/bin/python -X faulthandler /tmp/check.py

      - name: Keep the wheel in its release
        if: steps.release.outputs.url == ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "${TAG}" dist/*.whl \
            --title "DuckDB ${VERSION} for x86-64 CPUs without AVX" \
            --notes "DuckDB ${VERSION} compiled for x86-64-v2, for the latest-noavx image of DriveTest Analyzer. Generated by the Build DuckDB without AVX workflow." \
            --target "${GITHUB_SHA}" --prerelease --latest=false

      - name: Give the address of the wheel
        id: result
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          url=$(gh release view "${TAG}" --json assets -q '.assets[] | select(.name | endswith(".whl")) | .url')
          echo "${url}"
          echo "wheel_url=${url}" >> "${GITHUB_OUTPUT}"
